<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>NFT - Women to The Front</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="wrapper">
    <div class="text">
      Mint your NFT
    </div>
    <p><span id="web3_message">Loading web3...</span></p>
    <div class="btns">
      <input id="connect_button" type="button" value="connect" onclick="connectWallet()">
      </br>
      <input type="button" value="mint!" onclick="mint()">
    </div>
    <div>
      <div class="text">
        <p>Quantity:</p>

        <select class="text" id="mint_amount">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </div>
    </div>
    </br>
    <p id="nft_balance">...</p></br>
    <p id="total_mint"></p></br>
    <p id="price"></p></br></br>
    <div class="wrapper2">
      <img src="./images.gif" alt="Minerva" width="250" height="250">
    </div>

</body>
<script type="text/javascript" src="src/script.js">
</script>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/web3/1.3.5/web3.min.js"></script>
<script type="text/javascript" src="src/Minerva.js"></script>

</html>
